<!DOCTYPE html>
    <html xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <title>DCZO-local</title>
        <style type="text/css" media="screen">
  body, html {
    padding: 3px 3px 3px 3px;
    background-color: lightblue;
    font-family: "brandon-grotesque-n7","brandon-grotesque", sans-serif;
    font-style: normal;
    font-weight: 200;
    font-size: 11pt;
    text-align: center;
  }
  .km {font-size: 14px; font-weight: bold; color: #314483;}
  .img-overlay-wrap {
  position: relative;
  display: inline-block;
  width: 100%; /* or a fixed size */
  max-width: 960px;
}

.img-overlay-wrap img {
  display: block;
  width: 100%;
  height: auto;
}

.img-overlay-wrap svg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none; /* Allows clicks to pass through the SVG to the image if needed */
}
table, td, th, a, p {font-size: 10pt; padding: 4pt;}
tr { background-color: aliceblue;} tr:not(:first-child):hover {background-color: skyblue;}
.new{background-color: cornsilk;} a:link {color: darkred; text-decoration: none;}
</style></head>
    <body onload="create_rank_table()">
<h1>DCZO Takeoff Challenge</h1>
    <div class="img-overlay-wrap">
        <svg id="map_svg"></svg>
        <img src="zurich_map.png" alt="openstreet_maps" />
    </div>
    <h3 id="takeoff_info">Startplätze</h3>
    <button onclick="show_takeoffs()">Zeige Startplätze</button>

<a>Stand: 11. Oktober 2026</a>
<table id="ranking"></table>
<script>
const takeoffs = 'Alp-Scheidegg,419,106,Galgenen,356,292,Hüsliberg,539,251,Altwies,533,224,Hörnli,418,24,Bachtel,366,122,';
const pilots = '1,Philipp,6,2460,Alp-Scheidegg Galgenen Hüsliberg Altwies Bachtel,2,Irene,3,1820,Alp-Scheidegg Galgenen Hörnli,3,Thomas,2,945,Alp-Scheidegg Bachtel,4,Jaco,2,850,Galgenen Hörnli,5,Lowflyer,1,450,Alp-Scheidegg';
function show_takeoffs(){document.getElementById("takeoff_info").innerHTML = "<h3>loading...</h3>";
    to_array = takeoffs.split(',');
    let i = 0;
    svg_to = '<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">';
    do {
    x = parseInt(to_array[i + 1]); xt = x + 15;
    y = parseInt(to_array[i + 2]); yt = y + 5
    name = to_array[i];
    svg_to = svg_to + `<circle cx="${x}" cy="${y}" r="8" fill="red" /><text x="${xt}" y="${yt}" fill="red">${name}</text>`;
    i = i + 3;
    } while (i < to_array.length - 1);
    document.getElementById("map_svg").innerHTML = svg_to + "</svg>";
    document.getElementById("takeoff_info").innerHTML = "<h3> Alle Takeoff's </h3>";
    }
function pilot_takeoffs(pilot_id){document.getElementById("takeoff_info").innerHTML = "<h3>loading...</h3>";
    to_array = takeoffs.split(','); pilots_array = pilots.split(',');
    pilots_to = pilots_array[pilot_id * 5 + 4].split(' '); // returns an array of start grids;
    svg_to = '<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">';
    for (let grid of pilots_to) {
        let i = 0;
            do {
                if (to_array[i] == grid)
                    {
                    x = parseInt(to_array[i + 1]); xt = x + 15;
                    y = parseInt(to_array[i + 2]); yt = y + 5
                    name = to_array[i];
                    svg_to = svg_to + `<circle cx="${x}" cy="${y}" r="8" fill="red" /><text x="${xt}" y="${yt}" fill="red">${name}</text>`;
                    }
                i = i + 3;
                } while (i < to_array.length - 1);
        }
    document.getElementById("map_svg").innerHTML = svg_to + "</svg>";
    document.getElementById("takeoff_info").innerHTML = "<h3> Takeoffs von: " + pilots_array[pilot_id * 5 + 1] + " </h3>";
    }
function create_rank_table(){
    t_row='<table><tr><td><b>Rang</b></td><td><b>Pilot / Pilotin</b></td><td><b>Startplätze</b></td><td><b>Höhenmeter</b></td><td><b>Take-Offs</b></td></tr>';
    pilots_array = pilots.split(',');
    let i = 0;
    do {
    pilot_id = i / 5; rank = pilots_array[i + 0]; name = pilots_array[i + 1]; number = pilots_array[i + 2]; meters = pilots_array[i + 3]; grids = pilots_array[i + 4];
    t_row = t_row + `<tr onmouseover="pilot_takeoffs(${pilot_id})"><td>${rank}</td><td>${name}</td><td>${number}</td><td>${meters}</td><td>${grids}</td></tr>`;
    i = i + 5;
    } while (i < pilots_array.length - 1);
    document.getElementById("ranking").innerHTML = t_row + "</table>";
}
</script>
</body> </html>
